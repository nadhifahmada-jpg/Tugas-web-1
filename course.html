<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Jadwal Kuliah</title>
<style>
body {
    font-family: "Times New Roman", serif;
    background: white;
    margin: 22px;
}
.nama-file {
    font: bold 11px Arial, sans-serif;
    margin-bottom: 6px;
}
.container {
    width: 470px;
    padding: 4px;
    border: 3px ridge #aaa;
    box-sizing: border-box;
    background: white;
}
h2 {
    font-size: 19px;
    margin: 14px 0;
}
.judul {
    text-align: center;
    margin-bottom: 3px;
    font-size: 15px;
}
table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    font-size: 13px;
}
th, td {
    padding: 4px 3px;
    white-space: nowrap;
    background: #fff;
    border-top: 2px solid #fff;
    border-left: 2px solid #fff;
    border-right: 2px solid #777;
    border-bottom: 2px solid #777;
    box-shadow: inset 1px 1px 0 #ddd;
}
th {
    text-align: center;
}
</style>
</head>
<body>
<div class="nama-file"><H2>course-schedule.html</H2></div>
<div class="container">
<h2>Jadwal Kuliah</h2>
<div class="judul">Jadwal Kuliah Semester 1</div>
<table>
    <colgroup>
        <col style="width: 16%">
        <col style="width: 25%">
        <col style="width: 37%">
        <col style="width: 22%">
    </colgroup>
    <thead>
        <tr>
            <th>Hari</th>
            <th>Jam</th>
            <th>Mata Kuliah</th>
            <th>Ruangan</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>Senin</td>
            <td>08:00 - 10:00</td>
            <td>Pemrograman Web</td>
            <td>Lab 1</td>
        </tr>
        <tr>
            <td>Selasa</td>
            <td>10:00 - 12:00</td>
            <td>Basis Data</td>
            <td>Lab 2</td>
        </tr>
        <tr>
            <td>Rabu</td>
            <td>08:00 - 10:00</td>
            <td>Algoritma</td>
            <td>Ruang 201</td>
        </tr>
        <tr>
            <td>Kamis</td>
            <td>13:00 - 15:00</td>
            <td>Sistem Operasi</td>
            <td>Ruang 202</td>
        </tr>

        <tr>
            <td colspan="3">Kegiatan Mahasiswa</td>
            <td>Aula</td>
        </tr>
    </tbody>
</table>
</div>
</body>
</html>
